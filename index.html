<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#E07A5F" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="TripDiary — יומן טיול אינטראקטיבי לנייד"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css?v=8" />
    <title>TripDiary</title>
  </head>
  <body>
    <div id="app" class="app">
      <div class="app-top" hidden>
        <header class="app-header" id="app-header">
          <h1 class="trip-title" id="trip-title">TripDiary</h1>
          <p class="trip-meta" id="trip-meta" hidden></p>
          <div class="header-actions">
            <button type="button" class="btn btn--ghost btn--small" id="open-fx" disabled>
              שערי המרה
            </button>
            <button type="button" class="btn btn--ghost btn--small" id="open-settings">
              הגדרות
            </button>
            <button type="button" class="btn btn--ghost btn--small" id="import-trip">
              ייבוא JSON
            </button>
            <button type="button" class="btn btn--ghost btn--small" id="export-trip" disabled>
              ייצוא JSON
            </button>
            <button type="button" class="btn btn--ghost btn--small" id="reset-trip" disabled>
              איפוס — מחיקת כל הנתונים
            </button>
          </div>
          <p class="import-error" id="import-error" hidden role="alert"></p>
        </header>

        <nav
          class="day-tabs"
          id="day-tabs"
          role="tablist"
          aria-label="ימי הטיול"
        ></nav>
      </div>

      <section class="empty-state" id="empty-state">
        <p class="empty-state__brand">TripDiary</p>
        <h2 class="empty-state__title">יומן טיול אינטראקטיבי</h2>
        <p class="empty-state__lead">
          ייבאו קובץ JSON של הטיול כדי להתחיל. הנתונים נשמרים רק במכשיר שלכם.
        </p>
        <button type="button" class="btn btn--primary btn--block empty-state__cta" id="empty-import">
          ייבוא קובץ טיול
        </button>
        <p class="import-error" id="empty-import-error" hidden role="alert"></p>
        <button type="button" class="btn btn--ghost btn--small empty-state__settings" id="empty-settings">
          הגדרות
        </button>
      </section>

      <main
        class="day-panel"
        id="day-panel"
        role="tabpanel"
        tabindex="0"
        aria-live="polite"
        hidden
      ></main>
    </div>

    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
    />

    <script type="module" src="js/main.js?v=8"></script>
  </body>
</html>
